<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Flow Doctor</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: var(--bg-subtle); }
  @keyframes lfd-spin { to { transform: rotate(360deg); } }
  @keyframes lfd-pulse { 0%,100%{opacity:1}50%{opacity:.5} }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-gray-300); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--color-gray-400); }
  button:hover { opacity: 0.9; }
  :focus-visible { outline: 2px solid var(--color-teal-400, #2bb3a3); outline-offset: 2px; border-radius: 4px; }
  input:focus-visible, select:focus-visible { outline-offset: 0; }
  tr[role="link"]:hover, tr[role="link"]:focus-visible { background: var(--color-teal-50, #eef8f6) !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .lfd-shell { flex-direction: column; height: auto !important; overflow: visible !important; }
    .lfd-sidebar { width: 100% !important; height: auto !important; max-height: none; }
    .lfd-sidebar > div:nth-child(2) { display: none; }
    .lfd-sidebar > div:nth-child(3) { display: flex; flex-direction: row; overflow-x: auto !important; gap: 4px; padding: 6px 8px !important; }
    .lfd-sidebar > div:nth-child(3) > div { display: none; }
    .lfd-sidebar > div:nth-child(3) > button { width: auto !important; white-space: nowrap; flex-shrink: 0; min-height: 44px; }
    .lfd-sidebar > div:nth-child(n+4) { display: none; }
    .lfd-main { overflow: visible !important; flex-direction: column; }
    .lfd-main > * { min-width: 0; overflow-x: auto; }
    .lfd-main [style*="grid-template-columns"], .lfd-main [style*="gridTemplateColumns"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./CaseList.jsx"></script>
<script type="text/babel" src="./CaseDetail.jsx"></script>
<script type="text/babel" src="./Agenda.jsx"></script>
<script type="text/babel" src="./Jurisprudencia.jsx"></script>
<script type="text/babel" src="./App.jsx"></script>
</body>
</html>
