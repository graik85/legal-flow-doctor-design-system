<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals & Gold" subtitle="Gray scale and gold accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-default); font-family: var(--font-sans); }
  .scale-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 8px; }
  .scale { display: flex; gap: 4px; margin-bottom: 16px; }
  .swatch { flex: 1; }
  .swatch-body { height: 36px; border-radius: 4px; }
  .swatch-name { font-size: 9px; font-weight: 600; color: var(--fg-default); display: block; margin-top: 4px; }
  .swatch-hex  { font-size: 9px; font-family: var(--font-mono); color: var(--fg-muted); display: block; }
</style>
</head>
<body>
<div class="scale-label">Gray</div>
<div class="scale">
  <div class="swatch"><div class="swatch-body" style="background:#0d0f12;"></div><span class="swatch-name">950</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#1a1d22;"></div><span class="swatch-name">900</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#2c3038;"></div><span class="swatch-name">800</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#424852;"></div><span class="swatch-name">700</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#5a6170;"></div><span class="swatch-name">600</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#737b8c;"></div><span class="swatch-name">500</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#9399a6;"></div><span class="swatch-name">400</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#b8bdc8;"></div><span class="swatch-name">300</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#d5d9e0; border:1px solid #e2e5ec;"></div><span class="swatch-name">200</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#eceff4; border:1px solid #e2e5ec;"></div><span class="swatch-name">100</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#f5f7fa; border:1px solid #e2e5ec;"></div><span class="swatch-name">50</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#ffffff; border:1px solid #e2e5ec;"></div><span class="swatch-name">white</span></div>
</div>
<div class="scale-label">Gold</div>
<div class="scale">
  <div class="swatch"><div class="swatch-body" style="background:#5c3d0a;"></div><span class="swatch-name">900</span><span class="swatch-hex">#5c3d0a</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#8b5e18;"></div><span class="swatch-name">700</span><span class="swatch-hex">#8b5e18</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#a8752a;"></div><span class="swatch-name">600</span><span class="swatch-hex">#a8752a</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#c9943a;"></div><span class="swatch-name">500 ★</span><span class="swatch-hex">#c9943a</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#d9ae62;"></div><span class="swatch-name">400</span><span class="swatch-hex">#d9ae62</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#f0dbb0; border:1px solid #e2e5ec;"></div><span class="swatch-name">200</span><span class="swatch-hex">#f0dbb0</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#faf0d8; border:1px solid #e2e5ec;"></div><span class="swatch-name">100</span><span class="swatch-hex">#faf0d8</span></div>
  <div class="swatch"><div class="swatch-body" style="background:#fdfaf2; border:1px solid #e2e5ec;"></div><span class="swatch-name">50</span><span class="swatch-hex">#fdfaf2</span></div>
</div>
</body>
</html>
