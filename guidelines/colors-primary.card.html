<!-- @dsCard group="Colors" viewport="700x260" name="Navy & Teal" subtitle="Core brand color scales" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-default); font-family: var(--font-sans); }
  .scale-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 8px; }
  .scale { display: flex; gap: 4px; margin-bottom: 16px; }
  .swatch { flex: 1; border-radius: 4px; }
  .swatch-body { height: 40px; border-radius: 4px 4px 0 0; }
  .swatch-meta { padding: 4px 2px 0; }
  .swatch-name { font-size: 9px; font-weight: 600; color: var(--fg-default); display: block; }
  .swatch-hex  { font-size: 9px; font-family: var(--font-mono); color: var(--fg-muted); display: block; }
</style>
</head>
<body>
<div class="scale-label">Navy</div>
<div class="scale">
  <div class="swatch"><div class="swatch-body" style="background:#040c18;"></div><div class="swatch-meta"><span class="swatch-name">950</span><span class="swatch-hex">#040c18</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#0f2137;"></div><div class="swatch-meta"><span class="swatch-name">900</span><span class="swatch-hex">#0f2137</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#162e4d;"></div><div class="swatch-meta"><span class="swatch-name">800</span><span class="swatch-hex">#162e4d</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#1d3a61;"></div><div class="swatch-meta"><span class="swatch-name">700</span><span class="swatch-hex">#1d3a61</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#244876;"></div><div class="swatch-meta"><span class="swatch-name">600</span><span class="swatch-hex">#244876</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#2e5d96;"></div><div class="swatch-meta"><span class="swatch-name">500</span><span class="swatch-hex">#2e5d96</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#5882b5;"></div><div class="swatch-meta"><span class="swatch-name">400</span><span class="swatch-hex">#5882b5</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#8aabd0;"></div><div class="swatch-meta"><span class="swatch-name">300</span><span class="swatch-hex">#8aabd0</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#c0d2e7;"></div><div class="swatch-meta"><span class="swatch-name">200</span><span class="swatch-hex">#c0d2e7</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#dfe8f2; border:1px solid #e2e5ec;"></div><div class="swatch-meta"><span class="swatch-name">100</span><span class="swatch-hex">#dfe8f2</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#f0f5fb; border:1px solid #e2e5ec;"></div><div class="swatch-meta"><span class="swatch-name">50</span><span class="swatch-hex">#f0f5fb</span></div></div>
</div>
<div class="scale-label">Teal</div>
<div class="scale">
  <div class="swatch"><div class="swatch-body" style="background:#073630;"></div><div class="swatch-meta"><span class="swatch-name">900</span><span class="swatch-hex">#073630</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#0c5149;"></div><div class="swatch-meta"><span class="swatch-name">800</span><span class="swatch-hex">#0c5149</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#106b61;"></div><div class="swatch-meta"><span class="swatch-name">700</span><span class="swatch-hex">#106b61</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#14867a;"></div><div class="swatch-meta"><span class="swatch-name">600 ★</span><span class="swatch-hex">#14867a</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#1aa395;"></div><div class="swatch-meta"><span class="swatch-name">500</span><span class="swatch-hex">#1aa395</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#2dbfaf;"></div><div class="swatch-meta"><span class="swatch-name">400</span><span class="swatch-hex">#2dbfaf</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#5dd4c6;"></div><div class="swatch-meta"><span class="swatch-name">300</span><span class="swatch-hex">#5dd4c6</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#9ee8de;"></div><div class="swatch-meta"><span class="swatch-name">200</span><span class="swatch-hex">#9ee8de</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#d0f4f0; border:1px solid #e2e5ec;"></div><div class="swatch-meta"><span class="swatch-name">100</span><span class="swatch-hex">#d0f4f0</span></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#edfaf8; border:1px solid #e2e5ec;"></div><div class="swatch-meta"><span class="swatch-name">50</span><span class="swatch-hex">#edfaf8</span></div></div>
</div>
</body>
</html>
